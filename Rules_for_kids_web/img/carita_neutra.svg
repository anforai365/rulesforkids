<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Degradado esférico amarillo -->
    <radialGradient id="esfera" cx="38%" cy="32%" r="62%">
      <stop offset="0%"   stop-color="#fff59d"/>
      <stop offset="45%"  stop-color="#f9c800"/>
      <stop offset="100%" stop-color="#7a6000"/>
    </radialGradient>
    <radialGradient id="brillo" cx="42%" cy="28%" r="38%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <filter id="suavizar">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Sombra en el suelo -->
  <ellipse cx="50" cy="95" rx="32" ry="5" fill="black" opacity="0.18" filter="url(#suavizar)"/>

  <!-- Cuerpo esférico -->
  <circle cx="50" cy="50" r="44" fill="url(#esfera)"/>
  <circle cx="50" cy="50" r="44" fill="url(#brillo)"/>

  <!-- Ojos neutros -->
  <ellipse cx="33" cy="40" rx="5.5" ry="5" fill="#5a4000"/>
  <ellipse cx="67" cy="40" rx="5.5" ry="5" fill="#5a4000"/>
  <ellipse cx="31.5" cy="38.2" rx="1.8" ry="1.6" fill="white" opacity="0.65"/>
  <ellipse cx="65.5" cy="38.2" rx="1.8" ry="1.6" fill="white" opacity="0.65"/>

  <!-- Boca recta (indiferente) -->
  <line x1="33" y1="66" x2="67" y2="66" stroke="#5a4000" stroke-width="3.5" stroke-linecap="round"/>
</svg>
