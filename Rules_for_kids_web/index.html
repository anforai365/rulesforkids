<!-- Documento HTML principal para la aplicación web Normas para niñ@s, una herramienta para gestionar tareas infantiles con recompensas -->
<!DOCTYPE html>
<html lang="es">
<!-- Sección de metadatos, enlaces a scripts externos y estilos CSS integrados -->

<head>
  <!-- Metadatos para configuración de la página: codificación UTF-8, viewport responsivo y título de la aplicación -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⭐ Normas para Niñ@s </title>

  <!-- Carga de la biblioteca Supabase JS desde CDN para interactuar con la base de datos -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Estilos CSS integrados para el diseño de la aplicación, incluyendo fuentes, variables y componentes -->
  <style>
    /* ==================== FONTS ==================== */
    /* Definiciones de fuentes personalizadas cargadas localmente para optimizar el rendimiento */
    @font-face {
      font-family: 'Fredoka One';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/fredoka-one.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url('fonts/nunito-400.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url('fonts/nunito-600.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url('fonts/nunito-700.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 800;
      font-display: swap;
      src: url('fonts/nunito-800.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    /* ==================== VARIABLES & RESET ==================== */
    /* Variables CSS personalizadas para colores, radios y sombras, y reset global de estilos */
    :root {
      --c-bg: #f0f4ff;
      --c-sidebar: #1e1b4b;
      --c-sidebar-hover: #312e81;
      --c-accent: #7c3aed;
      --c-accent2: #06b6d4;
      --c-accent3: #f59e0b;
      --c-green: #10b981;
      --c-red: #ef4444;
      --c-card: #ffffff;
      --c-text: #1e293b;
      --c-muted: #64748b;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(30, 27, 75, 0.10);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
    }

    /* ==================== LOGIN ==================== */
    /* Estilos para la pantalla de inicio de sesión, incluyendo fondo degradado, tarjeta y animaciones */
    .login-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, #7c3aed 0%, #06b6d4 60%, #f59e0b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: white;
      border-radius: 28px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      text-align: center;
      animation: popIn .5s cubic-bezier(.175, .885, .32, 1.275);
    }

    @keyframes popIn {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .login-logo {
      font-size: 4rem;
      margin-bottom: .5rem;
    }

    .login-title {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      color: var(--c-accent);
      margin-bottom: .25rem;
    }

    .login-subtitle {
      color: var(--c-muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login-input {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: .875rem 1.25rem;
      font-size: 1rem;
      font-family: 'Nunito', sans-serif;
      outline: none;
      transition: border .2s;
    }

    .login-input:focus {
      border-color: var(--c-accent);
    }

    .login-btn {
      background: linear-gradient(135deg, var(--c-accent), #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      padding: .875rem;
      font-size: 1.05rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, .4);
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .login-note {
      font-size: .82rem;
      color: var(--c-muted);
      margin-top: 1rem;
    }

    /* ==================== APP LAYOUT ==================== */
    /* Estilos para el layout principal de la aplicación, incluyendo sidebar y contenido principal */
    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    /* ---- Sidebar ---- */
    /* Estilos para la barra lateral, incluyendo logo, navegación y lista de hijos */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--c-sidebar);
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
    }

    .sidebar-logo {
      font-family: 'Fredoka One', cursive;
      font-size: 1.15rem;
      color: white;
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: 2rem;
      padding: 0 .5rem;
      line-height: 1.25;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: .4rem;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .7);
      text-align: left;
      padding: .75rem 1rem;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: all .18s;
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: var(--c-accent);
      color: white;
      transform: translateX(4px);
    }

    .sidebar-hijos {
      margin-top: 2rem;
      flex: 1;
      overflow-y: auto;
    }

    .sidebar-hijos-title {
      font-size: .75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: rgba(255, 255, 255, .4);
      margin-bottom: .75rem;
      padding: 0 .5rem;
    }

    .hijo-item {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .6rem .8rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all .18s;
      margin-bottom: .25rem;
    }

    .hijo-item:hover,
    .hijo-item.active {
      background: rgba(255, 255, 255, .12);
    }

    .hijo-avatar {
      font-size: 1.4rem;
    }

    .hijo-nombre {
      color: white;
      font-weight: 700;
      font-size: .9rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hijo-puntos {
      color: var(--c-accent3);
      font-size: .78rem;
      font-weight: 700;
    }

    .add-hijo-btn {
      background: rgba(255, 255, 255, .08);
      border: 2px dashed rgba(255, 255, 255, .2);
      color: rgba(255, 255, 255, .6);
      width: 100%;
      border-radius: 10px;
      padding: .6rem;
      font-size: .85rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      margin-top: .5rem;
      transition: all .18s;
    }

    .add-hijo-btn:hover {
      background: rgba(255, 255, 255, .15);
      color: white;
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .45);
      padding: .75rem 1rem;
      border-radius: 10px;
      font-size: .9rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: all .18s;
      margin-top: 1rem;
    }

    .logout-btn:hover {
      color: #fca5a5;
      background: rgba(239, 68, 68, .12);
    }

    .musica-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, .45);
      text-align: left;
      padding: .6rem 1rem;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      width: 100%;
      margin-bottom: .25rem;
      transition: all .18s;
      display: flex;
      align-items: center;
      gap: .4rem;
    }

    .musica-btn:hover {
      color: #a5f3fc;
      background: rgba(6, 182, 212, .12);
    }

    .musica-btn.musica-activa {
      color: #a5f3fc;
    }

    /* ---- Main Content ---- */
    /* Estilos para el contenido principal, incluyendo encabezado y área de contenido */
    .main-content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      max-width: 100%;
    }

    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .main-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.9rem;
      color: var(--c-text);
    }

    .main-subtitle {
      color: var(--c-muted);
      font-size: .9rem;
      margin-top: .1rem;
    }

    .puntos-badge {
      background: linear-gradient(135deg, var(--c-accent3), #fb923c);
      color: white;
      padding: .6rem 1.2rem;
      border-radius: 50px;
      font-weight: 800;
      font-size: 1.1rem;
      white-space: nowrap;
      box-shadow: 0 4px 15px rgba(245, 158, 11, .3);
    }

    /* ==================== TABLA SEMANAL ==================== */
    /* Estilos para la tabla semanal de tareas, incluyendo celdas, botones de caritas y acciones */
    .tabla-wrapper {
      overflow-x: auto;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      background: white;
      margin-bottom: 1.25rem;
    }

    .tabla-semanal {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    .tabla-semanal th,
    .tabla-semanal td {
      padding: .75rem .5rem;
    }

    .th-tarea {
      text-align: left;
      padding-left: 1.25rem;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--c-muted);
      font-weight: 800;
      min-width: 180px;
    }

    .th-dia {
      text-align: center;
      font-size: .75rem;
      font-weight: 800;
      color: var(--c-muted);
      min-width: 64px;
    }

    .th-dia.hoy {
      color: var(--c-accent);
    }

    .dia-nombre {
      font-size: .8rem;
      font-weight: 900;
    }

    .dia-fecha {
      font-size: .7rem;
      font-weight: 600;
      opacity: .7;
    }

    .th-accion {
      width: 40px;
    }

    .fila-tarea:not(:last-child) td {
      border-bottom: 1px solid #f1f5f9;
    }

    .fila-tarea:hover {
      background: #f8faff;
    }

    .td-tarea {
      padding-left: 1.25rem;
    }

    .tarea-icono {
      font-size: 1.4rem;
      margin-right: .4rem;
    }

    .tarea-nombre {
      font-weight: 700;
      font-size: .95rem;
    }

    .tarea-puntos {
      font-size: .75rem;
      color: var(--c-accent3);
      font-weight: 700;
      margin-left: .4rem;
    }

    .td-dia {
      text-align: center;
    }

    .carita-btn {
      background: none;
      border: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
      transition: transform .2s cubic-bezier(.175,.885,.32,1.275), filter .2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .carita-btn svg {
      width: 48px;
      height: 48px;
      display: block;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,.15));
      transition: filter .2s;
    }

    .carita-btn:hover {
      transform: scale(1.3);
    }

    .carita-btn:hover svg {
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
    }

    .carita-btn:active {
      transform: scale(0.95);
    }

    .celda-feliz { background: #dcfce7; }
    .celda-triste { background: #fee2e2; }
    .celda-vacia { opacity: .55; }

    /* Animación de rebote al hacer click */
    @keyframes caritaBounce {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.45); }
      70%  { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .carita-btn.bounce {
      animation: caritaBounce .4s cubic-bezier(.36,.07,.19,.97);
    }

    .delete-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: .35;
      transition: opacity .15s;
      padding: .25rem;
    }

    .delete-btn:hover {
      opacity: 1;
    }

    .delete-hijo-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: .35;
      transition: opacity .15s;
      padding: .25rem;
      margin-left: .5rem;
    }

    .delete-hijo-btn:hover {
      opacity: 1;
    }

    /* ==================== EMPTY STATE ==================== */
    /* Estilos para el estado vacío cuando no hay tareas o hijos */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 320px;
      color: var(--c-muted);
      font-size: 1rem;
      font-weight: 600;
    }

    /* ==================== BOTONES ==================== */
    /* Estilos para botones primarios y secundarios utilizados en la aplicación */
    .btn-primary {
      background: linear-gradient(135deg, var(--c-accent), #a78bfa);
      color: white;
      border: none;
      border-radius: 12px;
      padding: .75rem 1.5rem;
      font-size: .95rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, .35);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: none;
      border-radius: 12px;
      padding: .6rem .8rem;
      font-size: .9rem;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }

    .btn-secondary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
    }

    .btn-secondary:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .mt-1 {
      margin-top: 1rem;
    }

    .semana-nav {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-top: .5rem;
    }

    /* ==================== ESTADÍSTICAS ==================== */
    /* Estilos para las tarjetas de estadísticas y gráficos de barras */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      text-align: center;
      transition: transform .18s;
    }

    .stat-card:hover {
      transform: translateY(-3px);
    }

    .stat-card.accent {
      background: linear-gradient(135deg, var(--c-accent), #818cf8);
      color: white;
    }

    .stat-icon {
      font-size: 2rem;
      margin-bottom: .5rem;
    }

    .stat-label {
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      opacity: .7;
    }

    .stat-valor {
      font-family: 'Fredoka One', cursive;
      font-size: 2.8rem;
      line-height: 1.1;
    }

    .stat-sub {
      font-size: .78rem;
      opacity: .65;
      margin-top: .25rem;
    }

    .stat-bar {
      background: rgba(255, 255, 255, .25);
      border-radius: 50px;
      height: 8px;
      margin-top: .75rem;
      overflow: hidden;
    }

    .stat-fill {
      background: white;
      height: 100%;
      border-radius: 50px;
      transition: width .8s ease;
    }

    /* ---- Bar Chart ---- */
    .chart-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.75rem;
      box-shadow: var(--shadow);
    }

    .chart-title {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
      color: var(--c-text);
    }

    .bar-chart {
      display: flex;
      align-items: flex-end;
      gap: .75rem;
      height: 180px;
    }

    .bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      gap: .25rem;
      height: 100%;
    }

    .bar-label-top {
      font-size: .72rem;
      font-weight: 700;
      color: var(--c-accent);
      height: 16px;
    }

    .bar-wrap {
      flex: 1;
      width: 100%;
      background: #f1f5f9;
      border-radius: 8px 8px 0 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
    }

    .bar-fill {
      background: linear-gradient(to top, var(--c-accent), #a78bfa);
      width: 100%;
      border-radius: 8px 8px 0 0;
      min-height: 4px;
      transition: height .8s cubic-bezier(.34, 1.56, .64, 1);
    }

    .bar-label {
      font-size: .78rem;
      font-weight: 800;
      color: var(--c-muted);
    }

    .bar-sub {
      font-size: .65rem;
      color: var(--c-muted);
      opacity: .7;
    }

    /* ==================== TIENDA ==================== */
    /* Estilos para la tienda de recompensas, incluyendo tarjetas de premios y botones de canje */
    .tienda-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .premio-card {
      background: white;
      border-radius: var(--radius);
      padding: 1.5rem 1rem;
      text-align: center;
      box-shadow: var(--shadow);
      border: 3px solid transparent;
      transition: all .2s;
      position: relative;
    }

    .premio-card.disponible {
      border-color: var(--c-green);
      background: #f0fdf4;
    }

    .premio-card.canjeado {
      opacity: .6;
      filter: grayscale(.5);
    }

    .premio-card:hover:not(.canjeado) {
      transform: translateY(-4px);
    }

    .premio-icono {
      font-size: 2.8rem;
      margin-bottom: .75rem;
    }

    .premio-nombre {
      font-weight: 800;
      font-size: .95rem;
      margin-bottom: .4rem;
    }

    .premio-puntos {
      color: var(--c-accent3);
      font-weight: 700;
      font-size: .85rem;
      margin-bottom: .75rem;
    }

    .premio-falta {
      font-size: .78rem;
      color: var(--c-muted);
      font-weight: 600;
    }

    .btn-canjear {
      background: linear-gradient(135deg, var(--c-green), #34d399);
      color: white;
      border: none;
      border-radius: 10px;
      padding: .5rem 1rem;
      font-size: .85rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: transform .15s;
    }

    .btn-canjear:hover {
      transform: scale(1.08);
    }

    .canjeado-badge {
      background: #d1fae5;
      color: #065f46;
      border-radius: 8px;
      padding: .3rem .75rem;
      font-size: .78rem;
      font-weight: 700;
      display: inline-block;
    }

    /* ==================== MODALES ==================== */
    /* Estilos para modales emergentes, incluyendo overlay, tarjeta modal y elementos internos */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal-card {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      width: 100%;
      max-width: 380px;
      position: relative;
      animation: popIn .3s cubic-bezier(.175, .885, .32, 1.275);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
      transition: background .15s;
    }

    .modal-close:hover {
      background: #e2e8f0;
    }

    .modal-title {
      font-family: 'Fredoka One', cursive;
      font-size: 1.5rem;
      color: var(--c-accent);
    }

    .modal-input {
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: .75rem 1rem;
      font-size: .95rem;
      font-family: 'Nunito', sans-serif;
      outline: none;
      transition: border .2s;
      width: 100%;
    }

    .modal-input:focus {
      border-color: var(--c-accent);
    }

    /* ==================== TOAST ==================== */
    /* Estilos para notificaciones toast en la esquina inferior derecha */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 999;
      padding: .875rem 1.5rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: .95rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .2);
      animation: slideUp .3s ease;
    }

    .toast.hidden {
      display: none;
    }

    .toast.success {
      background: #10b981;
      color: white;
    }

    .toast.error {
      background: #ef4444;
      color: white;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* ==================== RESPONSIVE ==================== */
    /* Estilos responsivos para dispositivos móviles y tablets */
    @media (max-width: 640px) {
      .sidebar {
        width: 200px;
        min-width: 200px;
      }

      .main-content {
        padding: 1rem;
      }

      .main-title {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 500px) {
      .app-layout {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        flex-direction: row;
        flex-wrap: wrap;
        padding: 1rem;
        gap: .5rem;
      }

      .sidebar-logo {
        flex: 1;
        margin-bottom: 0;
      }

      .sidebar-nav {
        flex-direction: row;
        flex-wrap: wrap;
      }

      .sidebar-hijos {
        display: none;
      }
    }

    /* ==================== EMOJI PICKER UNIVERSAL ==================== */
    
  /* Modal del picker — más alto que los otros para mostrar categorías */
  .modal-card-picker {
  max-width: 460px;
  max-height: 88vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  }

  /* Franja superior: previsualización del emoji elegido + botón confirmar */
  .picker-preview-wrap {

  align-items: center;

  .picker-scroll {

  /* Cuadrícula de emojis */
  .picker-grid {

  /* Cada botón emoji */
  .picker-opcion {

  /* ---- Campo emoji en los modales de hijo / tarea / recompensa ---- */
  .emoji-field-wrap {

  /* Botón grande que muestra el emoji actual y abre el picker al pulsarlo */

  border-radius: 10px;

  height: 48px;
  font-size: 1.6rem;

  transition: all .15s;
  display: flex;
  align-items: center;
  justify-content: center;

  .emoji-field-btn:hover {

  transform: scale(1.08);
  }


  /* ==================== SEMANA Y FECHA DE TAREA ==================== */

  /* Línea de semana debajo del nombre del hijo — más grande que el subtítulo normal */
  .main-semana {
  font-size: 1.05rem;

  /* Columna de tarea: nombre e icono en columna para dejar sitio a la fecha */
  .tarea-info {

  .stats-periodo-wrap {

  .bar-chart-anio .bar-col {

  /* ==================== ESTADÍSTICAS — BANNER GLOBAL ==================== */
  .stats-global-banner {
    background: linear-gradient(135deg, var(--c-sidebar) 0%, #312e81 100%);

  /* Grid período: solo 1 columna ancha para la tarjeta de cumplimiento */
